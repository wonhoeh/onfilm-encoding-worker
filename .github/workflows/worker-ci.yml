name: Worker CI

on:
  pull_request:
    branches:
      - main
      - test
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

  mysql-integration-test:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Docker availability
        run: docker info

      - name: Run MySQL integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Upload integration test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-integration-test-report
          path: |
            build/reports/tests/integrationTest
            build/test-results/integrationTest
          if-no-files-found: ignore
          retention-days: 7

  deploy-performance:
    name: Deploy Worker to performance EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - unit-test
      - mysql-integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: performance
    env:
      WORKER_EC2_HOST: ${{ vars.WORKER_EC2_HOST }}
      WORKER_EC2_USER: ${{ vars.WORKER_EC2_USER }}
      WORKER_DEPLOY_DIR: ${{ vars.WORKER_DEPLOY_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in WORKER_EC2_HOST WORKER_EC2_USER WORKER_DEPLOY_DIR; do
            if [ -z "${!variable_name}" ]; then
              echo "Missing GitHub Environment variable: ${variable_name}" >&2
              exit 1
            fi
          done

      - name: Build executable JAR
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew bootJar --no-daemon
          artifact_path=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)
          if [ -z "$artifact_path" ]; then
            echo "Executable JAR was not created" >&2
            exit 1
          fi
          install -m 644 "$artifact_path" "/tmp/onfilm-worker-${GITHUB_SHA}.jar"

      - name: Configure SSH host verification
        shell: bash
        env:
          WORKER_EC2_SSH_PRIVATE_KEY: ${{ secrets.WORKER_EC2_SSH_PRIVATE_KEY }}
          WORKER_EC2_KNOWN_HOSTS: ${{ secrets.WORKER_EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$WORKER_EC2_SSH_PRIVATE_KEY" ] || [ -z "$WORKER_EC2_KNOWN_HOSTS" ]; then
            echo "Missing Worker EC2 SSH secret" >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$WORKER_EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/onfilm-worker"
          printf '%s\n' "$WORKER_EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/onfilm-worker" "$HOME/.ssh/known_hosts"

      - name: Upload release JAR
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -i "$HOME/.ssh/onfilm-worker" \
            -o IdentitiesOnly=yes \
            "/tmp/onfilm-worker-${GITHUB_SHA}.jar" \
            "${WORKER_EC2_USER}@${WORKER_EC2_HOST}:${WORKER_DEPLOY_DIR}/"

      - name: Activate release and verify health
        shell: bash
        run: |
          set -euo pipefail
          release_path="${WORKER_DEPLOY_DIR}/onfilm-worker-${GITHUB_SHA}.jar"
          ssh \
            -i "$HOME/.ssh/onfilm-worker" \
            -o IdentitiesOnly=yes \
            "${WORKER_EC2_USER}@${WORKER_EC2_HOST}" \
            "sudo /bin/bash -s -- '${release_path}'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          release_path=$1
          current_path=/opt/onfilm-worker/current.jar
          previous_path=

          if [ ! -f "$release_path" ]; then
            echo "Release JAR does not exist: ${release_path}" >&2
            exit 1
          fi

          if [ -L "$current_path" ]; then
            resolved_current_path=$(readlink -f "$current_path" || true)
            if [ -n "$resolved_current_path" ] \
              && [ "$resolved_current_path" != "$current_path" ] \
              && [ -f "$resolved_current_path" ]; then
              previous_path=$resolved_current_path
            fi
          fi

          ln -sfn "$release_path" "$current_path"
          systemctl enable onfilm-worker
          systemctl restart onfilm-worker

          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8082/actuator/health \
              | grep --quiet '"status":"UP"'; then
              echo "OnFilm Worker is healthy"
              exit 0
            fi
            sleep 5
          done

          echo "OnFilm Worker health check failed" >&2
          journalctl -u onfilm-worker -n 100 --no-pager >&2 || true

          if [ -n "$previous_path" ] && [ -f "$previous_path" ] && [ "$previous_path" != "$release_path" ]; then
            echo "Rolling back to ${previous_path}" >&2
            ln -sfn "$previous_path" "$current_path"
            systemctl restart onfilm-worker
          else
            echo "No previous healthy release is available; stopping Worker" >&2
            systemctl stop onfilm-worker || true
            rm -f "$current_path"
          fi

          exit 1
          REMOTE_SCRIPT
