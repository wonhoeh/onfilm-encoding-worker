server:
  port: ${WORKER_SERVER_PORT:8082}

spring:
  datasource:
    url: jdbc:h2:mem:encoding-worker;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

app:
  worker:
    topic: media.encode.requested
    group-id: onfilm-encoding-worker
    ffmpeg-path: ffmpeg
    ffprobe-path: ffprobe
    working-dir: ${WORKER_WORKING_DIR:./tmp/encoding-worker}
  storage:
    type: local
    local-root: ${LOCAL_STORAGE_ROOT:./local-storage}
    allowed-buckets:
      - onfilm-media
  core-api:
    base-url: http://localhost:8080
