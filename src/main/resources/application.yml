server:
  port: ${WORKER_SERVER_PORT:8082}

spring:
  application:
    name: onfilm-encoding-worker
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: 2
  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 10800000
    listener:
      ack-mode: record
  datasource:
    url: ${WORKER_DB_URL:jdbc:mysql://127.0.0.1:3306/onfilm_worker}
    username: ${WORKER_DB_USER:onfilm_worker_app}
    password: ${WORKER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-migration-naming: true

app:
  worker:
    topic: media.encode.requested
    group-id: onfilm-encoding-worker
    ffmpeg-path: ffmpeg
    ffprobe-path: ffprobe
    working-dir: /tmp/onfilm-encoding-worker
    transcode-timeout: PT2H
    processing-lease: PT3H
    max-source-bytes: 10737418240
    max-media-duration: PT6H
    concurrency: 1
    retry-attempts: 5
    retry-delay-millis: 1000
    retry-multiplier: 2
    failure-report-delay: 60000
    stale-recovery-delay: 60000
  storage:
    type: s3
    region: ap-northeast-2
    allowed-buckets:
      - ${MEDIA_STORAGE_BUCKET:onfilm-media}
    api-call-timeout: PT10M
    api-call-attempt-timeout: PT3M
  core-api:
    base-url: http://localhost:8080
    processing-path: /internal/api/media-jobs/{jobId}/processing
    completion-path: /internal/api/media-jobs/{jobId}/complete
    failure-path: /internal/api/media-jobs/{jobId}/fail
    callback-secret: ${MEDIA_ENCODE_CALLBACK_SECRET}
    connect-timeout: PT5S
    read-timeout: PT30S

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${METRICS_ENVIRONMENT:dev}
    distribution:
      percentiles-histogram:
        media.encode.worker.attempt.duration: true
        media.encode.worker.stage.duration: true
        media.encode.worker.callback.duration: true
      minimum-expected-value:
        media.encode.worker.attempt.duration: 1s
        media.encode.worker.stage.duration: 1ms
        media.encode.worker.callback.duration: 1ms
      maximum-expected-value:
        media.encode.worker.attempt.duration: 3h
        media.encode.worker.stage.duration: 3h
        media.encode.worker.callback.duration: 1m
